name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build and Upload Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            name: bundletool-mcp-linux-amd64
          - os: linux
            arch: arm64
            name: bundletool-mcp-linux-arm64
          - os: darwin
            arch: amd64
            name: bundletool-mcp-darwin-amd64
          - os: darwin
            arch: arm64
            name: bundletool-mcp-darwin-arm64
          - os: windows
            arch: amd64
            name: bundletool-mcp-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: go build -ldflags="-X 'main.Version=${{ github.event.release.tag_name }}'" -o ${{ matrix.name }} ./cmd/bundletool-mcp
      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ${{ matrix.name }}
